<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Southampton Student Marketplace</title>
<style>
  :root{
    --brand:#7A3B5E; --price:#e0344a; --bg:#f5f4f6; --card:#fff;
    --text:#25202b; --muted:#9a94a3; --line:#ecebee;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
  header{background:var(--brand);color:#fff;padding:14px 16px;
    padding-top:max(14px,env(safe-area-inset-top));position:sticky;top:0;z-index:20}
  header .wrap{max-width:1080px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
  header .htxt{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-width:0}
  .lang{flex:none;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;
    padding:6px 14px;border-radius:999px;font-size:13px;font-family:inherit;cursor:pointer}
  .lang:hover{background:rgba(255,255,255,.25)}
  .lang.busy{opacity:.6;cursor:wait}
  header h1{font-size:17px;font-weight:700}
  header span{font-size:11.5px;opacity:.75}

  .sbar{max-width:1080px;margin:12px auto 0;padding:0 12px}
  .sbar input{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:999px;
    font-size:14px;font-family:inherit;background:#fff;color:var(--text);outline:none}
  .sbar input:focus{border-color:var(--brand)}
  .chips{max-width:1080px;margin:10px auto 0;padding:0 12px;display:flex;gap:8px;
    overflow-x:auto;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;border:1px solid var(--line);background:#fff;color:var(--text);
    padding:7px 14px;border-radius:999px;font-size:13px;font-family:inherit;cursor:pointer;
    white-space:nowrap}
  .chip:hover{border-color:var(--brand)}
  .chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  #status{max-width:1080px;margin:10px auto 0;padding:0 12px;font-size:12px;color:var(--muted)}

  /* 瀑布流：手机2列，屏幕越大列越多 */
  .masonry{max-width:1080px;margin:10px auto 30px;padding:0 8px;
    column-count:2;column-gap:8px}
  @media(min-width:640px){.masonry{column-count:3}}
  @media(min-width:900px){.masonry{column-count:4;column-gap:12px}}
  .card{break-inside:avoid;background:var(--card);border-radius:12px;overflow:hidden;
    margin-bottom:8px;cursor:pointer;box-shadow:0 1px 4px rgba(40,25,40,.06)}
  .card:active{transform:scale(.98)}
  .ph{width:100%;display:block;background:linear-gradient(135deg,#f0eaee,#e5dce2)}
  .ph img{width:100%;display:block}
  .ph .emoji{display:flex;align-items:center;justify-content:center;height:130px;font-size:44px}
  .pc{position:absolute}
  .cb{padding:8px 10px 10px}
  .t{font-size:13.5px;line-height:1.45;font-weight:600;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .d{margin-top:4px;font-size:12px;line-height:1.5;color:var(--muted);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
  .tag{font-size:10.5px;padding:2px 8px;border-radius:999px;background:#eceaf0;color:#7a7583}
  .tag.wa{background:#d9f2d9;color:#1f6b34}
  .tag.wx{background:#d9e8f5;color:#1c5a8a}
  .dt2{margin-top:4px;font-size:10.5px;color:var(--muted)}
  .p{margin-top:6px;font-size:16px;font-weight:800;color:var(--price)}
  .p small{font-size:10.5px;font-weight:500}
  .c{margin-top:5px;font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .badge{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.5);color:#fff;
    font-size:10.5px;padding:2px 7px;border-radius:999px}
  .phwrap{position:relative}
  .empty{text-align:center;color:var(--muted);padding:70px 20px;font-size:14px;column-span:all}

  /* 详情层 */
  #detail{display:none;position:fixed;inset:0;background:#fff;z-index:100;overflow:auto;
    overscroll-behavior:contain}
  #detail.open{display:block}
  .dtop{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;
    padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));
    background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .dtop button{border:none;background:#f1eff3;width:34px;height:34px;border-radius:50%;
    font-size:16px;cursor:pointer;flex:none}
  .dtop .dt{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .swrap{position:relative}
  .snav{position:absolute;top:50%;transform:translateY(-50%);border:none;width:40px;height:40px;
    border-radius:50%;background:rgba(0,0,0,.45);color:#fff;font-size:20px;cursor:pointer;z-index:5;
    display:flex;align-items:center;justify-content:center}
  .snav:hover{background:rgba(0,0,0,.65)}
  .snav.prev{left:12px}.snav.next{right:12px}
  .sdots i{cursor:pointer}
  .swiper{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;background:#171319;
    -webkit-overflow-scrolling:touch}
  .swiper::-webkit-scrollbar{display:none}
  .slide{flex:0 0 100%;scroll-snap-align:center;display:flex;align-items:center;justify-content:center;
    min-height:300px;max-height:62vh}
  .slide img{max-width:100%;max-height:62vh;object-fit:contain}
  .slide .emoji{font-size:90px;padding:70px 0}
  .sdots{display:flex;justify-content:center;gap:6px;padding:10px 0 0}
  .sdots i{width:7px;height:7px;border-radius:50%;background:#d8d3dc}
  .sdots i.on{background:var(--brand)}
  .dbody{max-width:680px;margin:0 auto;padding:16px 18px 40px}
  .dprice{font-size:26px;font-weight:800;color:var(--price)}
  .dprice small{font-size:13px;font-weight:500}
  .dname{font-size:18px;font-weight:700;margin-top:8px;line-height:1.4}
  .ddesc{font-size:14.5px;line-height:1.8;margin-top:12px;white-space:pre-wrap;color:#3c3644}
  .dcontact{margin-top:18px;background:#faf7f9;border:1px solid var(--line);border-radius:12px;
    padding:13px 15px;font-size:14px}
  .dcontact b{color:var(--brand)}
  footer{text-align:center;color:var(--muted);font-size:11.5px;padding:0 16px 26px;column-span:all}
</style>
</head>
<body>

<header><div class="wrap">
  <div class="htxt"><h1 id="hTitle">🛒 Southampton Student Marketplace</h1><span id="hSub">Second-hand finds from our groups</span></div>
  <button class="lang" id="langBtn" onclick="toggleLang()">中文</button>
</div></header>
<div class="sbar"><input id="q" type="search" placeholder="🔍 Search items…" autocomplete="off"></div>
<div class="chips" id="chips"></div>
<div id="status"></div>
<div class="masonry" id="grid"></div>
<footer id="foot"></footer>

<div id="detail">
  <div class="dtop"><button onclick="closeDetail()">✕</button><div class="dt" id="dTitle"></div></div>
  <div class="swrap">
    <div class="swiper" id="dSwiper"></div>
    <button class="snav prev" id="sPrev" onclick="slideBy(-1)">‹</button>
    <button class="snav next" id="sNext" onclick="slideBy(1)">›</button>
  </div>
  <div class="sdots" id="dDots"></div>
  <div class="dbody">
    <div class="dprice" id="dPrice"></div>
    <div class="dname" id="dName"></div>
    <div class="ddesc" id="dDesc"></div>
    <div class="dcontact" id="dContact"></div>
  </div>
</div>

<script src="config.js"></script>
<script>
/* ================================================================
   Airtable connection.
   The access token lives in config.js (kept separate so this file
   contains no secrets and can be updated freely).
   config.js must define:
     window.MARKET_CONFIG = { part1: "pat....", part2: ".xxxx" };
   ================================================================ */
const CONFIG = Object.assign({
  part1 : "", part2 : "",
  baseId: "appz12UiXQCVgMbOq",
  table : "Listings",
  view  : "公开展示 Public Gallery"
}, window.MARKET_CONFIG || {});
CONFIG.token = CONFIG.part1 + CONFIG.part2;

/* Demo data shown when Airtable is not connected */
const DEMO = [
 {name:"Canon EOS Rebel T7 Camera",desc:"18-55mm lens included, excellent condition.",price:320,contact:"WeChat demo123",icon:"📷",photos:[]},
 {name:"Vintage Leather Sofa",desc:"Three-seater, minor scratches on armrest.",price:350,contact:"WeChat demo123",icon:"🛋️",photos:[]},
 {name:"iPhone 13 Pro Max 256G",desc:"Sierra Blue, unlocked, box included.",price:750,contact:"WeChat demo123",icon:"📱",photos:[]},
 {name:"Oak Dining Table",desc:"Solid wood, seats 6, extension leaf.",price:425,contact:"WeChat demo123",icon:"🪑",photos:[]},
 {name:"Mini Fridge",desc:"Perfect for dorms, like new.",price:45,contact:"WeChat demo123",icon:"🧊",photos:[]},
 {name:"Ergonomic Office Chair",desc:"Adjustable headrest and armrests.",price:20,contact:"WeChat demo123",icon:"💺",photos:[]}
];

/* ---------- 语言 / Language ---------- */
let LANG="en";
const T={
  en:{title:"🛒 Southampton Student Marketplace", sub:"Second-hand finds from our groups",
      search:"🔍 Search items…", all:"All", btn:"中文",
      empty:"Nothing for sale right now — check back soon!", noMatch:"No items match your search",
      contact:"Interested? Contact seller:", ask:"Ask in the group chat for details",
      posted:"Posted", item:"item", items:"items", live:"updates live",
      loading:"Loading…", translating:"Translating…"},
  zh:{title:"🛒 南安普顿学生二手市集", sub:"来自群里的二手好物",
      search:"🔍 搜索物品…", all:"全部", btn:"EN",
      empty:"暂时没有在卖的东西，过几天再来看看～", noMatch:"没有找到符合的物品",
      contact:"想要？联系卖家：", ask:"详情请在群里问卖家",
      posted:"发布于", item:"件", items:"件", live:"实时更新",
      loading:"加载中…", translating:"翻译中…"}
};
const t=k=>T[LANG][k];

const TCACHE={};           // 原文 -> 中文
async function trOne(txt){
  if(!txt) return txt;
  if(TCACHE[txt]) return TCACHE[txt];
  try{
    const r=await fetch("https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=zh-CN&dt=t&q="+encodeURIComponent(txt));
    const j=await r.json();
    const out=(j[0]||[]).map(x=>x[0]).join("");
    if(out){TCACHE[txt]=out;return out}
  }catch(e){}
  try{
    const r=await fetch("https://api.mymemory.translated.net/get?q="+encodeURIComponent(txt)+"&langpair=en|zh-CN");
    const j=await r.json();
    const out=j?.responseData?.translatedText;
    if(out){TCACHE[txt]=out;return out}
  }catch(e){}
  return txt;
}
async function translateItems(){
  const jobs=[];
  ITEMS.forEach(i=>{
    ["name","desc","cat"].forEach(k=>{
      const v=i[k];
      if(v && !/^[\d\s\p{P}]*$/u.test(v) && i["_zh_"+k]===undefined){
        jobs.push(trOne(v).then(z=>{i["_zh_"+k]=z}));
      }
    });
  });
  if(jobs.length) await Promise.all(jobs);
}
/* 取显示值：中文模式优先用译文 */
const dv=(i,k)=>(LANG==="zh" && i["_zh_"+k])?i["_zh_"+k]:i[k];

async function toggleLang(){
  const btn=$("langBtn");
  if(LANG==="en"){
    btn.classList.add("busy"); btn.disabled=true;
    $("status").textContent=T.zh.translating;
    await translateItems();
    LANG="zh";
    btn.classList.remove("busy"); btn.disabled=false;
    $("status").textContent="";
  }else{ LANG="en"; }
  applyLang(); render();
}
function applyLang(){
  document.documentElement.lang = LANG==="zh"?"zh-CN":"en";
  $("hTitle").textContent=t("title");
  $("hSub").textContent=t("sub");
  $("q").placeholder=t("search");
  $("langBtn").textContent=t("btn");
  document.title=LANG==="zh"?"南安普顿学生二手市集":"Southampton Student Marketplace";
}

const $=id=>document.getElementById(id);
let ITEMS=[], curr=null;
function srcClass(v){v=String(v).toLowerCase();return v.includes("whatsapp")?"wa":(v.includes("wechat")||v.includes("微信"))?"wx":""}
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

async function load(){
  const configured = /^pat[A-Za-z0-9]+\.[A-Za-z0-9]+$/.test(CONFIG.token);
  if(!configured){
    ITEMS=DEMO;
    $("status").textContent="⚠️ Preview mode: showing demo data (Airtable not connected)";
    render(); return;
  }
  $("status").textContent=t("loading");
  try{
    let records=[], offset="";
    do{
      const url=`https://api.airtable.com/v0/${CONFIG.baseId}/${encodeURIComponent(CONFIG.table)}?view=${encodeURIComponent(CONFIG.view)}&pageSize=100`+(offset?`&offset=${offset}`:"");
      const r=await fetch(url,{headers:{Authorization:`Bearer ${CONFIG.token}`}});
      if(!r.ok)throw new Error("HTTP "+r.status);
      const j=await r.json();
      records.push(...j.records); offset=j.offset||"";
    }while(offset);
    ITEMS=records.map(rec=>{
      const f=rec.fields;
      return {
        name: f["Item name"]||"Untitled",
        desc: f["Description"]||"",
        price: f["Price"]??"",
        contact: f["Contact Information"]||"",
        cat: f["Category"]||"",
        src: f["Source"]||"",
        date: f["Date Posted"]||"",
        photos: (f["Photos"]||[]).map(p=>({full:p.url,thumb:(p.thumbnails&&(p.thumbnails.large||p.thumbnails.full)||p).url})),
        icon:"📦"
      };
    });
    $("status").textContent="";
  }catch(e){
    $("status").textContent="⚠️ Failed to load ("+e.message+"), showing demo data";
    ITEMS=DEMO;
  }
  render();
}

let VIEW=[], CAT="";
function renderChips(){
  const cats=[...new Set(ITEMS.map(i=>i.cat).filter(Boolean))].sort();
  $("chips").innerHTML=cats.length
    ? [`<button class="chip ${CAT?"":"on"}" onclick="pickCat('')">${t("all")}</button>`]
        .concat(cats.map(c=>{
          const label=LANG==="zh"?(ITEMS.find(i=>i.cat===c)?.["_zh_cat"]||c):c;
          return `<button class="chip ${CAT===c?"on":""}" onclick="pickCat('${esc(c).replace(/'/g,"\\'")}')">${esc(label)}</button>`;
        })).join("")
    : "";
}
function pickCat(c){ CAT=(CAT===c)?"":c; render(); }
function render(){
  const q=($("q").value||"").trim().toLowerCase();
  VIEW=ITEMS.filter(i=>
    (!CAT || i.cat===CAT) &&
    (!q || [i.name,i.desc,i.cat,i.src,i.contact,i._zh_name,i._zh_desc,i._zh_cat].filter(Boolean).join(" ").toLowerCase().includes(q)));
  renderChips();
  $("grid").innerHTML=VIEW.length?VIEW.map((i,idx)=>`
    <div class="card" onclick="openDetail(${idx})">
      <div class="phwrap">
        <div class="ph">${i.photos.length?`<img src="${i.photos[0].thumb}" loading="lazy" alt="${esc(i.name)}">`:`<div class="emoji">${i.icon}</div>`}</div>
        ${i.photos.length>1?`<span class="badge">📷 ${i.photos.length}</span>`:""}
      </div>
      <div class="cb">
        <div class="t">${esc(dv(i,"name"))}</div>
        ${i.desc?`<div class="d">${esc(dv(i,"desc"))}</div>`:""}
        ${(i.cat||i.src)?`<div class="tags">${i.cat?`<span class="tag">${esc(dv(i,"cat"))}</span>`:""}${i.src?`<span class="tag ${srcClass(i.src)}">${esc(i.src)}</span>`:""}</div>`:""}
        <div class="p"><small>£</small>${Number(i.price).toLocaleString()}</div>
        ${i.contact?`<div class="c">💬 ${esc(i.contact)}</div>`:""}
        ${i.date?`<div class="dt2">📅 ${esc(i.date)}</div>`:""}
      </div>
    </div>`).join(""):`<div class="empty">${ITEMS.length?t("noMatch"):t("empty")}</div>`;
  $("foot").textContent=VIEW.length?`${VIEW.length} ${VIEW.length>1?t("items"):t("item")} · ${t("live")}`:"";
}

function openDetail(idx){
  curr=VIEW[idx];
  $("dTitle").textContent=dv(curr,"name");
  $("dPrice").innerHTML=`<small>£</small>${Number(curr.price).toLocaleString()}`;
  $("dName").textContent=dv(curr,"name");
  $("dDesc").textContent=dv(curr,"desc")||"";
  const meta=[dv(curr,"cat"),curr.src,curr.date?`${t("posted")} ${curr.date}`:""].filter(Boolean).join(" · ");
  $("dContact").innerHTML=(meta?`<div style="margin-bottom:8px;font-size:12.5px;color:var(--muted)">${esc(meta)}</div>`:"")+(curr.contact?`${t("contact")} <b>${esc(curr.contact)}</b>`:t("ask"));
  $("dSwiper").innerHTML=curr.photos.length
    ? curr.photos.map(p=>`<div class="slide"><img src="${p.full}" alt=""></div>`).join("")
    : `<div class="slide"><div class="emoji">${curr.icon}</div></div>`;
  const n=Math.max(curr.photos.length,1);
  $("dDots").innerHTML=n>1?Array.from({length:n},(_,k)=>`<i class="${k?'':'on'}" onclick="slideTo(${k})"></i>`).join(""):"";
  $("sPrev").style.display=$("sNext").style.display=(curr.photos.length>1)?"flex":"none";
  $("dSwiper").scrollLeft=0;
  $("detail").classList.add("open");
  document.body.style.overflow="hidden";
}
function slideBy(d){
  const sw=$("dSwiper");
  const n=Math.max(curr?curr.photos.length:1,1);
  let k=Math.round(sw.scrollLeft/sw.clientWidth)+d;
  k=(k+n)%n;
  sw.scrollTo({left:k*sw.clientWidth,behavior:"smooth"});
}
function slideTo(k){
  const sw=$("dSwiper");
  sw.scrollTo({left:k*sw.clientWidth,behavior:"smooth"});
}
function closeDetail(){
  $("detail").classList.remove("open");
  document.body.style.overflow="";
}
$("dSwiper").addEventListener("scroll",()=>{
  const sw=$("dSwiper");
  const k=Math.round(sw.scrollLeft/sw.clientWidth);
  [...$("dDots").children].forEach((d,j)=>d.classList.toggle("on",j===k));
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape")closeDetail();
  if($("detail").classList.contains("open")&&curr&&curr.photos.length>1){
    if(e.key==="ArrowLeft")slideBy(-1);
    if(e.key==="ArrowRight")slideBy(1);
  }
});

$("q").addEventListener("input",render);
load();
</script>
</body>
</html>
