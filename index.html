<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Southampton Student Marketplace</title>
<style>
  :root{
    --brand:#7A3B5E; --price:#e0344a; --bg:#f5f4f6; --card:#fff;
    --text:#25202b; --muted:#9a94a3; --line:#ecebee;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
  header{background:var(--brand);color:#fff;padding:14px 16px;
    padding-top:max(14px,env(safe-area-inset-top));position:sticky;top:0;z-index:20}
  header .wrap{max-width:1080px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
  header .htxt{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-width:0}
  .lang{flex:none;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;
    padding:6px 14px;border-radius:999px;font-size:13px;font-family:inherit;cursor:pointer}
  .lang:hover{background:rgba(255,255,255,.25)}
  .lang.busy{opacity:.6;cursor:wait}
  header h1{font-size:17px;font-weight:700}
  header span{font-size:11.5px;opacity:.75}

  .sbar{max-width:1080px;margin:12px auto 0;padding:0 12px}
  .sbar input{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:999px;
    font-size:14px;font-family:inherit;background:#fff;color:var(--text);outline:none}
  .sbar input:focus{border-color:var(--brand)}
  .catbar{max-width:1080px;margin:10px auto 0;padding:0 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .sortsel{border:1px solid var(--line);background:#fff;color:var(--text);padding:8px 12px;
    border-radius:999px;font-size:13.5px;font-family:inherit;cursor:pointer;outline:none;max-width:60%}
  .sortsel:hover{border-color:var(--brand)}
  .sortsel.active{background:var(--brand);color:#fff;border-color:var(--brand)}
  .catbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;
    color:var(--text);padding:8px 15px;border-radius:999px;font-size:13.5px;font-family:inherit;cursor:pointer}
  .catbtn:hover{border-color:var(--brand)}
  .catbtn.active{background:var(--brand);color:#fff;border-color:var(--brand)}
  .catbtn .caret{font-size:11px;transition:transform .18s}
  .catbtn.open .caret{transform:rotate(180deg)}
  .chips{max-width:1080px;margin:0 auto;padding:0 12px;display:none;flex-wrap:wrap;gap:8px}
  .chips.open{display:flex;margin-top:8px}
  .chip{flex:none;border:1px solid var(--line);background:#fff;color:var(--text);
    padding:7px 14px;border-radius:999px;font-size:13px;font-family:inherit;cursor:pointer;
    white-space:nowrap}
  .chip:hover{border-color:var(--brand)}
  .chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  #status{max-width:1080px;margin:10px auto 0;padding:0 12px;font-size:12px;color:var(--muted)}

  /* 瀑布流：手机2列，屏幕越大列越多 */
  .masonry{max-width:1080px;margin:10px auto 30px;padding:0 8px;
    display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-items:stretch}
  @media(min-width:640px){.masonry{grid-template-columns:repeat(3,minmax(0,1fr))}}
  @media(min-width:900px){.masonry{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}}
  .card{background:var(--card);border-radius:12px;overflow:hidden;display:flex;
    flex-direction:column;height:100%;cursor:pointer;box-shadow:0 1px 4px rgba(40,25,40,.06)}
  .card:active{transform:scale(.98)}
  .ph{width:100%;height:100%;display:block;background:linear-gradient(135deg,#f0eaee,#e5dce2)}
  .ph img{width:100%;height:100%;display:block;object-fit:contain}
  .ph .emoji{display:flex;align-items:center;justify-content:center;height:100%;font-size:44px}
  .pc{position:absolute}
  .cb{padding:8px 10px 10px;height:220px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden}
  .t{font-size:13.5px;line-height:1.45;font-weight:600;height:40px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .d{margin-top:4px;font-size:12px;line-height:1.5;color:var(--muted);height:36px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .tags{display:flex;flex-direction:row;flex-wrap:wrap;align-items:flex-start;align-content:flex-start;
    gap:4px;margin-top:6px;height:42px;overflow:hidden}
  .tag-break{flex-basis:100%;height:0}
  .tag{font-size:10.5px;padding:2px 8px;border-radius:999px;background:#eceaf0;color:#7a7583}
  .tag.wa{background:#d9f2d9;color:#1f6b34}
  .tag.wx{background:#d9e8f5;color:#1c5a8a}
  .dt2{margin-top:4px;font-size:10.5px;color:var(--muted)}
  .p{margin-top:6px;font-size:16px;font-weight:800;color:var(--price)}
  .p small{font-size:10.5px;font-weight:500}
  .contacts{margin-top:4px;height:26px;display:flex;flex-direction:column;gap:1px;overflow:hidden}
  .c{font-size:11px;line-height:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .badge{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.5);color:#fff;
    font-size:10.5px;padding:2px 7px;border-radius:999px}
  .phwrap{position:relative;aspect-ratio:1/1;overflow:hidden;flex:none}
  .empty{text-align:center;color:var(--muted);padding:70px 20px;font-size:14px;column-span:all}

  /* 详情层 */
  #detail{display:none;position:fixed;inset:0;background:#fff;z-index:100;overflow:auto;
    overscroll-behavior:contain}
  #detail.open{display:block}
  .dtop{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;
    padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));
    background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .dtop button{border:none;background:#f1eff3;width:34px;height:34px;border-radius:50%;
    font-size:16px;cursor:pointer;flex:none}
  .dtop .dt{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .swrap{position:relative}
  .snav{position:absolute;top:50%;transform:translateY(-50%);border:none;width:40px;height:40px;
    border-radius:50%;background:rgba(0,0,0,.45);color:#fff;font-size:20px;cursor:pointer;z-index:5;
    display:flex;align-items:center;justify-content:center}
  .snav:hover{background:rgba(0,0,0,.65)}
  .snav.prev{left:12px}.snav.next{right:12px}
  .sdots i{cursor:pointer}
  .swiper{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;background:#171319;
    -webkit-overflow-scrolling:touch}
  .swiper::-webkit-scrollbar{display:none}
  .slide{flex:0 0 100%;scroll-snap-align:center;display:flex;align-items:center;justify-content:center;
    min-height:300px;max-height:62vh}
  .slide img{max-width:100%;max-height:62vh;object-fit:contain;cursor:zoom-in}
  .slide .emoji{font-size:90px;padding:70px 0}
  .sdots{display:flex;justify-content:center;gap:6px;padding:10px 0 0}
  .sdots i{width:7px;height:7px;border-radius:50%;background:#d8d3dc}
  .sdots i.on{background:var(--brand)}
  .dbody{max-width:680px;margin:0 auto;padding:16px 18px 40px}
  .dprice{font-size:26px;font-weight:800;color:var(--price)}
  .dprice small{font-size:13px;font-weight:500}
  .dname{font-size:18px;font-weight:700;margin-top:8px;line-height:1.4}
  .ddesc{font-size:14.5px;line-height:1.8;margin-top:12px;white-space:pre-wrap;color:#3c3644}
  .dcontact{margin-top:18px;background:#faf7f9;border:1px solid var(--line);border-radius:12px;
    padding:13px 15px;font-size:14px}
  .dcontact b{color:var(--brand)}
  .drow{display:flex;gap:10px;padding:6px 0;font-size:14px;align-items:baseline}
  .drow+.drow{border-top:1px solid var(--line)}
  .dk{flex:none;width:88px;color:var(--muted);font-size:12.5px}
  .dvv{color:var(--text);word-break:break-word}
  .dvv.hi{color:var(--brand);font-weight:700}
  #lightbox{display:none;position:fixed;inset:0;z-index:200;background:rgba(12,10,14,.98);color:#fff;overflow:hidden;touch-action:none}
  #lightbox.open{display:flex;flex-direction:column}
  .lbtop{position:relative;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;padding-top:max(12px,env(safe-area-inset-top));background:linear-gradient(rgba(0,0,0,.6),transparent)}
  .lbtools{display:flex;align-items:center;gap:7px}
  .lbbtn{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);color:#fff;min-width:40px;height:40px;padding:0 12px;border-radius:999px;font:600 18px/1 inherit;cursor:pointer}
  .lbbtn:hover{background:rgba(255,255,255,.24)}.lbbtn.scale{min-width:66px;font-size:13px}.lbclose{font-size:17px}
  .lbviewport{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:zoom-in;touch-action:none}
  .lbviewport.zoomed{cursor:grab}.lbviewport.dragging{cursor:grabbing}
  #lbImage{max-width:100%;max-height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none;transform-origin:center;will-change:transform}
  .lbhint{position:relative;z-index:3;margin:auto auto max(14px,env(safe-area-inset-bottom));padding:7px 12px;border-radius:999px;background:rgba(0,0,0,.55);font-size:12px;color:rgba(255,255,255,.8);pointer-events:none}
  @media(max-width:520px){.lbhint{font-size:11px}.lbbtn{min-width:38px;height:38px;padding:0 10px}}
  footer{text-align:center;color:var(--muted);font-size:11.5px;padding:0 16px 26px;column-span:all}
</style>
</head>
<body>

<header><div class="wrap">
  <div class="htxt"><h1 id="hTitle">🛒 Southampton Student Marketplace</h1><span id="hSub">Second-hand finds from our groups</span></div>
  <button class="lang" id="langBtn" onclick="toggleLang()">中文</button>
</div></header>
<div class="sbar"><input id="q" type="search" placeholder="🔍 Search items…" autocomplete="off"></div>
<div class="catbar">
  <button class="catbtn" id="catBtn" onclick="toggleCats()">
    <span id="catLabel"></span><span class="caret">▾</span>
  </button>
  <select class="sortsel" id="sortSel" onchange="SORT=this.value;render()"></select>
</div>
<div class="chips" id="chips"></div>
<div id="status"></div>
<div class="masonry" id="grid"></div>
<footer id="foot"></footer>

<div id="detail">
  <div class="dtop"><button onclick="closeDetail()">✕</button><div class="dt" id="dTitle"></div></div>
  <div class="swrap">
    <div class="swiper" id="dSwiper"></div>
    <button class="snav prev" id="sPrev" onclick="slideBy(-1)">‹</button>
    <button class="snav next" id="sNext" onclick="slideBy(1)">›</button>
  </div>
  <div class="sdots" id="dDots"></div>
  <div class="dbody">
    <div class="dprice" id="dPrice"></div>
    <div class="dname" id="dName"></div>
    <div class="ddesc" id="dDesc"></div>
    <div class="dcontact" id="dContact"></div>
  </div>
</div>

<div id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer">
  <div class="lbtop"><button class="lbbtn lbclose" id="lbClose" onclick="closeLightbox()" aria-label="Close">✕</button>
    <div class="lbtools"><button class="lbbtn" id="lbMinus" onclick="changeImageZoom(-.25)">−</button><button class="lbbtn scale" id="lbScale" onclick="resetImageZoom()">100%</button><button class="lbbtn" id="lbPlus" onclick="changeImageZoom(.25)">＋</button></div>
  </div>
  <div class="lbviewport" id="lbViewport"><img id="lbImage" src="" alt="" draggable="false"></div>
  <div class="lbhint" id="lbHint"></div>
</div>

<script src="config.js"></script>
<script>
/* ================================================================
   Airtable connection.
   The access token lives in config.js (kept separate so this file
   contains no secrets and can be updated freely).
   config.js must define:
     window.MARKET_CONFIG = { part1: "pat....", part2: ".xxxx" };
   ================================================================ */
const CONFIG = Object.assign({
  part1 : "", part2 : "",
  baseId: "appz12UiXQCVgMbOq",
  table : "Listings",
  view  : "公开展示 Public Gallery"
}, window.MARKET_CONFIG || {});
CONFIG.token = CONFIG.part1 + CONFIG.part2;

/* Demo data shown when Airtable is not connected */
const DEMO = [
 {name:"Canon EOS Rebel T7 Camera",desc:"18-55mm lens included, excellent condition.",price:320,contact:"WeChat demo123",src:["WeChat"],icon:"📷",photos:[]},
 {name:"Vintage Leather Sofa",desc:"Three-seater, minor scratches on armrest.",price:350,contact:"WeChat demo123",src:["WeChat"],icon:"🛋️",photos:[]},
 {name:"iPhone 13 Pro Max 256G",desc:"Sierra Blue, unlocked, box included.",price:750,contact:"WeChat demo123",src:["WeChat"],icon:"📱",photos:[]},
 {name:"Oak Dining Table",desc:"Solid wood, seats 6, extension leaf.",price:425,contact:"WeChat demo123",src:["WeChat"],icon:"🪑",photos:[]},
 {name:"Mini Fridge",desc:"Perfect for dorms, like new.",price:45,contact:"WeChat demo123",src:["WeChat"],icon:"🧊",photos:[]},
 {name:"Ergonomic Office Chair",desc:"Adjustable headrest and armrests.",price:20,contact:"WeChat demo123",src:["WeChat"],icon:"💺",photos:[]}
];

/* ---------- 语言 / Language ---------- */
let LANG="en";
const T={
  en:{title:"🛒 Southampton Student Marketplace", sub:"Second-hand finds from our groups",
      search:"🔍 Search items…", all:"All", btn:"中文",
      empty:"Nothing for sale right now — check back soon!", noMatch:"No items match your search",
      contact:"Interested? Contact seller:", ask:"Ask in the group chat for details",
      posted:"Posted", lCat:"Category", allCats:"All categories",
      sortDefault:"Sort: default", sortNew:"Newest first", sortOld:"Oldest first",
      sortLow:"Price: low to high", sortHigh:"Price: high to low", lSrc:"Source", lContact:"Contact",
      item:"item", items:"items", live:"updates live",
      loading:"Loading…", translating:"Translating…", zoomHint:"Scroll or pinch to zoom · drag to move", closeImage:"Close image", zoomOut:"Zoom out", zoomIn:"Zoom in", resetZoom:"Reset zoom"},
  zh:{title:"🛒 南安普顿学生二手市集", sub:"来自群里的二手好物",
      search:"🔍 搜索物品…", all:"全部", btn:"EN",
      empty:"暂时没有在卖的东西，过几天再来看看～", noMatch:"没有找到符合的物品",
      contact:"想要？联系卖家：", ask:"详情请在群里问卖家",
      posted:"发布于", lCat:"分类", allCats:"全部分类",
      sortDefault:"排序：默认", sortNew:"最新发布", sortOld:"最早发布",
      sortLow:"价格：低到高", sortHigh:"价格：高到低", lSrc:"来源", lContact:"联系方式",
      item:"件", items:"件", live:"实时更新",
      loading:"加载中…", translating:"翻译中…", zoomHint:"滚轮或双指缩放 · 拖动查看细节", closeImage:"关闭图片", zoomOut:"缩小", zoomIn:"放大", resetZoom:"恢复原始大小"}
};
const t=k=>T[LANG][k];

const savedTranslations=(()=>{try{return JSON.parse(localStorage.getItem("marketTranslationCacheV2")||"{}")}catch(e){return {}}})();
const TCACHE={zh:savedTranslations.zh||{},en:savedTranslations.en||{}};
const HAS_CJK=/[\u3400-\u9fff]/;
const CAT_PAIRS={
  "Furniture":"家具",
  "Home Appliances":"家用电器",
  "Kitchenware":"厨房用品",
  "Cleaning":"清洁用品",
  "Electronics":"电子产品",
  "Fitness":"健身器材",
  "Home":"家居用品",
  "Books & Study":"书籍与学习",
  "Clothing":"服装",
  "Sports & Fitness":"运动健身",
  "Other":"其他"
};
const CAT_TO_EN=Object.fromEntries(Object.entries(CAT_PAIRS).map(([en,zh])=>[zh,en]));
function saveTranslations(){
  try{localStorage.setItem("marketTranslationCacheV2",JSON.stringify(TCACHE))}catch(e){}
}
function fixedCategory(txt,target){
  const v=String(txt||"").trim();
  if(!v)return v;
  if(target==="zh"){
    if(CAT_PAIRS[v])return CAT_PAIRS[v];
    if(CAT_TO_EN[v])return v;
  }else{
    if(CAT_TO_EN[v])return CAT_TO_EN[v];
    if(CAT_PAIRS[v])return v;
  }
  return "";
}
async function trOne(txt,target){
  if(!txt)return txt;
  const alreadyTarget=target==="zh"?HAS_CJK.test(txt):!HAS_CJK.test(txt);
  if(alreadyTarget)return txt;
  if(TCACHE[target][txt])return TCACHE[target][txt];
  const targetCode=target==="zh"?"zh-CN":"en";
  try{
    const r=await fetch("https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl="+targetCode+"&dt=t&q="+encodeURIComponent(txt));
    const j=await r.json();
    const out=(j[0]||[]).map(x=>x[0]).join("");
    if(out){TCACHE[target][txt]=out;saveTranslations();return out}
  }catch(e){}
  try{
    const langPair=target==="zh"?"en|zh-CN":"zh-CN|en";
    const r=await fetch("https://api.mymemory.translated.net/get?q="+encodeURIComponent(txt)+"&langpair="+langPair);
    const j=await r.json();
    const out=j?.responseData?.translatedText;
    if(out){TCACHE[target][txt]=out;saveTranslations();return out}
  }catch(e){}
  return txt;
}
async function translateItems(target){
  const jobs=[];
  ITEMS.forEach(i=>{
    ["name","desc"].forEach(k=>{
      const v=i[k],dest="_"+target+"_"+k;
      if(v&&!/^[\d\s\p{P}]*$/u.test(v)&&i[dest]===undefined){
        jobs.push(trOne(v,target).then(z=>{i[dest]=z}));
      }
    });
    if(i.cat){
      const dest="_"+target+"_cat";
      if(i[dest]===undefined){
        const fixed=fixedCategory(i.cat,target);
        if(fixed)i[dest]=fixed;
        else jobs.push(trOne(i.cat,target).then(z=>{i[dest]=z}));
      }
    }
  });
  if(jobs.length)await Promise.all(jobs);
}
/* 取显示值：名称、描述和分类随当前语言切换 */
const dv=(i,k)=>i["_"+LANG+"_"+k]||i[k];

async function toggleLang(){
  const btn=$("langBtn"),target=LANG==="en"?"zh":"en";
  btn.classList.add("busy");btn.disabled=true;
  $("status").textContent=T[target].translating;
  try{
    await translateItems(target);
    LANG=target;
  }finally{
    btn.classList.remove("busy");btn.disabled=false;
    $("status").textContent="";
  }
  applyLang();render();
}
function applyLang(){
  document.documentElement.lang=LANG==="zh"?"zh-CN":"en";
  $("hTitle").textContent=t("title");
  $("hSub").textContent=t("sub");
  $("q").placeholder=t("search");
  $("langBtn").textContent=t("btn");
  document.title=LANG==="zh"?"南安普顿学生二手市集":"Southampton Student Marketplace";
  updateLightboxLabels();
}

/* ---------- 智能搜索：同义词词典 + 模糊匹配 ---------- */
/* 每一组里的词互为近义词，中英混排。搜其中任意一个，组内其他词都能命中。
   以后要加词，直接往对应的组里加即可。 */
const SYN_GROUPS = [
 ["锅","炖锅","汤锅","煮锅","奶锅","平底锅","炒锅","锅具","锅子","pot","pots","pan","pans","saucepan","stockpot","cookware","milk pan","frying pan"],
 ["滤网","过滤器","滤器","漏勺","筛子","筛网","滤锅","沥水篮","洗菜篮","strainer","sieve","colander","filter"],
 ["碗","盘","盘子","碟子","杯","杯子","马克杯","酒杯","餐具","餐盘","bowl","bowls","plate","plates","dish","dishes","cup","cups","mug","glassware","wine glass","dinnerware","tableware","crockery"],
 ["刀","菜刀","水果刀","刀具","主厨刀","砧板","菜板","案板","切菜板","削皮器","刨刀","knife","knives","chopping board","cutting board","board","peeler","chef knife"],
 ["勺","勺子","汤勺","汤匙","铲","锅铲","翻转铲","餐勺","长柄勺","spoon","spoons","ladle","turner","spatula","utensil","utensils","server"],
 ["叉","叉子","筷子","刀叉","刀叉勺","cutlery","fork","forks","chopsticks","teaspoon","silverware"],
 ["刨丝器","擦丝器","磨碎器","擦子","礤床","grater","graters","shredder"],
 ["夹子","食物夹","烧烤夹","剪刀","厨房剪","开瓶器","开罐器","起子","tongs","scissors","opener","corkscrew","bottle opener"],
 ["碗架","沥水架","碗碟架","置物架","滴水架","dish rack","drainer","draining rack","rack"],
 ["咖啡","法压壶","咖啡壶","滤压壶","french press","coffee","cafetiere","coffee maker"],
 ["水壶","烧水壶","电水壶","热水壶","kettle","boiler"],
 ["微波炉","烤箱","电饭煲","电饭锅","空气炸锅","microwave","oven","rice cooker","air fryer","toaster","烤面包机"],
 ["冰箱","小冰箱","冷藏","fridge","refrigerator","mini fridge","freezer"],
 ["椅","椅子","座椅","办公椅","电脑椅","转椅","凳","凳子","靠椅","chair","chairs","stool","seat","office chair","desk chair","armchair"],

const SYN_INDEX = SYN_GROUPS.map(g => g.map(x => x.toLowerCase()));
const isCJK = ch => /[一-鿿]/.test(ch);

/* 把查询词扩展成一组近义词 */
function expandQuery(q){
  const out = new Set([q]);
  SYN_INDEX.forEach(group => {
    const hit = group.some(term => term === q || (term.length>1 && q.includes(term)) || (q.length>1 && term.includes(q)));
    if(hit) group.forEach(term => out.add(term));
  });
  return [...out];
}
/* 模糊相似度：中文按字重叠，英文按二元组重叠 */
function fuzzyScore(q, hay){
  const cjk = [...q].filter(isCJK);
  if(cjk.length){
    const hitCount = cjk.filter(c => hay.includes(c)).length;
    const ratio = hitCount / cjk.length;
    return ratio >= 0.5 ? 30 + 30*ratio : 0;
  }
  if(q.length < 4) return 0;
  const bi = t => { const a=new Set(); for(let i=0;i<t.length-1;i++) a.add(t.slice(i,i+2)); return a; };
  const qb = bi(q); if(!qb.size) return 0;
  let best = 0;
  for(const w of hay.split(/[^a-z0-9]+/)){
    if(w.length < 3) continue;
    if(w.startsWith(q) || q.startsWith(w)){ best = Math.max(best, 0.9); continue; }
    const wb = bi(w);
    let inter = 0; qb.forEach(g => { if(wb.has(g)) inter++; });
    best = Math.max(best, (2*inter) / (qb.size + wb.size));   // Dice 系数
  }
  return best >= 0.62 ? 20 + 40*best : 0;
}
/* 整词匹配：英文要求词边界，中文直接包含 */
const escRe = t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
function hasTerm(hay, term){
  if(isCJK(term[0])) return hay.includes(term);
  return new RegExp("\\b" + escRe(term) + "\\b").test(hay);
}
/* 单件商品的匹配得分：0 表示不匹配 */
function matchScore(item, q, expanded, allowFuzzy){
  const L = v => String(v||"").toLowerCase();
  const nameHay = [L(item.name), L(item._zh_name), L(item._en_name)].join(" ");
  const bodyHay = [L(item.desc), L(item._zh_desc), L(item._en_desc)].join(" ");
  const metaHay = [L(item.cat), L(item._zh_cat), L(item._en_cat), srcList(item.src).join(" ").toLowerCase(),
    L(item.whatsapp), L(item.wechat), L(item.contact)].join(" ");
  /* 原词直接命中：名称 > 描述 > 分类 */
  if(nameHay.includes(q)) return 100;
  if(bodyHay.includes(q)) return 88;
  if(metaHay.includes(q)) return 76;
  /* 近义词命中：同样按位置分层 */
  const synHit = hay => expanded.some(term =>
    term !== q && term.length >= (isCJK(term[0]) ? 1 : 3) && hasTerm(hay, term));
  if(synHit(nameHay)) return 84;
  if(synHit(bodyHay)) return 72;
  if(synHit(metaHay)) return 60;
  return allowFuzzy ? fuzzyScore(q, nameHay + " " + bodyHay) : 0;
}

const $=id=>document.getElementById(id);
let ITEMS=[], curr=null;
function shuffled(items){
  const result=[...items];
  for(let i=result.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [result[i],result[j]]=[result[j],result[i]];
  }
  return result;
}
const hasPrice = v => v!==null && v!==undefined && v!=="" && !isNaN(Number(v));
function priceHTML(v, big){
  if(!hasPrice(v)) return "";
  return `<small>£</small>${Number(v).toLocaleString()}`;
}
/* 来源可能是数组（多选） */
const srcList = v => Array.isArray(v) ? v.filter(Boolean) : (v ? [v] : []);
function srcClass(v){v=String(v).toLowerCase();return v.includes("whatsapp")?"wa":(v.includes("wechat")||v.includes("微信"))?"wx":""}
function contactEntries(item){
  const entries=[];
  if(item.whatsapp) entries.push(["WhatsApp",item.whatsapp]);
  if(item.wechat) entries.push(["WeChat",item.wechat]);
  if(!entries.length&&item.contact){
    const sources=srcList(item.src);
    entries.push([sources.length===1?sources[0]:t("lContact"),item.contact]);
  }
  return entries;
}
const coverPhoto=item=>item.photos[0];
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

async function load(){
  const configured = /^pat[A-Za-z0-9]+\.[A-Za-z0-9]+$/.test(CONFIG.token);
  if(!configured){
    ITEMS=shuffled(DEMO);
    $("status").textContent="⚠️ Preview mode: showing demo data (Airtable not connected)";
    render(); return;
  }
  $("status").textContent=t("loading");
  try{
    let records=[], offset="";
    do{
      const url=`https://api.airtable.com/v0/${CONFIG.baseId}/${encodeURIComponent(CONFIG.table)}?view=${encodeURIComponent(CONFIG.view)}&pageSize=100`+(offset?`&offset=${offset}`:"");
      const r=await fetch(url,{headers:{Authorization:`Bearer ${CONFIG.token}`}});
      if(!r.ok)throw new Error("HTTP "+r.status);
      const j=await r.json();
      records.push(...j.records); offset=j.offset||"";
    }while(offset);
    ITEMS=shuffled(records.map(rec=>{
      const f=rec.fields;
      return {
        name: f["Item name"]||"",
        desc: f["Description"]||"",
        price: (f["Price"]===undefined||f["Price"]===null||f["Price"]==="") ? null : f["Price"],
        contact: f["Contact Information"]||"",
        whatsapp: f["WhatsApp Contact"]||"",
        wechat: f["WeChat Contact"]||"",
        cat: f["Category"]||"",
        src: Array.isArray(f["Source"]) ? f["Source"] : (f["Source"] ? [f["Source"]] : []),
        date: f["Date Posted"]||"",
        createdTime: rec.createdTime||"",
        photos: [...(f["Photos"]||[])].reverse().map(p=>({full:p.url,thumb:(p.thumbnails&&(p.thumbnails.large||p.thumbnails.full)||p).url})),
        icon:"📦"
      };
    }));
    await translateItems(LANG);
    $("status").textContent="";
  }catch(e){
    $("status").textContent="⚠️ Failed to load ("+e.message+"), showing demo data";
    ITEMS=shuffled(DEMO);
  }
  render();
}

let VIEW=[], CAT="", SORT="";
const SORT_KEYS=[["","sortDefault"],["dateDesc","sortNew"],["dateAsc","sortOld"],["priceAsc","sortLow"],["priceDesc","sortHigh"]];
function renderSort(){
  const sel=$("sortSel");
  sel.innerHTML=SORT_KEYS.map(([v,k])=>`<option value="${v}">${t(k)}</option>`).join("");
  sel.value=SORT;
  sel.classList.toggle("active", !!SORT);
}
function applySort(list){
  const num=v=>{const n=Number(v);return isNaN(n)?0:n};
  const day=v=>v?String(v):"";
  const time=v=>{const n=Date.parse(v);return Number.isNaN(n)?0:n};
  const a=[...list];
  const pk = (x,dir) => hasPrice(x.price) ? num(x.price) : (dir>0 ? Infinity : -Infinity); // 无价格永远排最后
  const dateCmp=(x,y,dir)=>{
    const dx=day(x.date), dy=day(y.date);
    if(!dx||!dy){
      if(dx===dy)return 0;
      return dx?-1:1;
    }
    const byDay=dx.localeCompare(dy);
    if(byDay)return byDay*dir;
    return (time(x.createdTime)-time(y.createdTime))*dir;
  };
  if(SORT==="priceAsc")  a.sort((x,y)=>pk(x,1)-pk(y,1));
  if(SORT==="priceDesc"){ a.sort((x,y)=>{
      const hx=hasPrice(x.price), hy=hasPrice(y.price);
      if(hx!==hy) return hx?-1:1;
      return num(y.price)-num(x.price);
    }); }
  if(SORT==="dateDesc")  a.sort((x,y)=>dateCmp(x,y,-1));
  if(SORT==="dateAsc")   a.sort((x,y)=>dateCmp(x,y,1));
  return a;
}
function renderChips(){
  const cats=[...new Set(ITEMS.map(i=>i.cat).filter(Boolean))].sort();
  const labelForCat=v=>{
    const item=ITEMS.find(i=>i.cat===v);
    return item?dv(item,"cat"):v;
  };
  $("catLabel").textContent=CAT?labelForCat(CAT):t("allCats");
  $("catBtn").classList.toggle("active",!!CAT);
  $("chips").innerHTML=cats.length
    ? [`<button class="chip ${CAT?"":"on"}" onclick="pickCat('')">${t("all")}</button>`]
        .concat(cats.map(c=>`<button class="chip ${CAT===c?"on":""}" onclick="pickCat('${esc(c).replace(/'/g,"\\'")}')">${esc(labelForCat(c))}</button>`)).join("")
    : "";
}
function pickCat(c){ CAT=(CAT===c)?"":c; $("chips").classList.remove("open"); $("catBtn").classList.remove("open"); render(); }
function toggleCats(){
  const open=$("chips").classList.toggle("open");
  $("catBtn").classList.toggle("open",open);
}
function render(){
  const q=($("q").value||"").trim().toLowerCase();
  const pool = ITEMS.filter(i => !CAT || i.cat===CAT);
  if(q){
    const expanded = expandQuery(q);
    const run = fz => pool.map(i => ({i, sc: matchScore(i, q, expanded, fz)}))
                          .filter(x => x.sc > 0)
                          .sort((a,b) => b.sc - a.sc);
    let hits = run(false);              // 先精确 + 同义词
    if(!hits.length) hits = run(true);  // 都没有才用模糊兜底（容错拼写/近似词）
    VIEW = hits.map(x => x.i);
  } else {
    VIEW = pool;
  }
  if(SORT) VIEW=applySort(VIEW);
  renderChips(); renderSort();
  $("grid").innerHTML=VIEW.length?VIEW.map((i,idx)=>`
    <div class="card" onclick="openDetail(${idx})">
      <div class="phwrap">
        <div class="ph">${i.photos.length?`<img src="${coverPhoto(i).thumb}" loading="lazy" alt="${esc(i.name)}">`:`<div class="emoji">${i.icon}</div>`}</div>
        ${i.photos.length>1?`<span class="badge">📷 ${i.photos.length}</span>`:""}
      </div>
      <div class="cb">
        <div class="t">${esc(dv(i,"name"))}</div>
        ${i.desc?`<div class="d">${esc(dv(i,"desc"))}</div>`:""}
        ${(i.cat||srcList(i.src).length)?`<div class="tags">${i.cat?`<span class="tag">${esc(dv(i,"cat"))}</span><span class="tag-break" aria-hidden="true"></span>`:""}${srcList(i.src).map(sv=>`<span class="tag ${srcClass(sv)}">${esc(sv)}</span>`).join("")}</div>`:""}
        ${hasPrice(i.price)?`<div class="p">${priceHTML(i.price)}</div>`:""}
        ${contactEntries(i).length?`<div class="contacts">${contactEntries(i).map(([channel,value])=>`<div class="c">💬 ${esc(channel)}: ${esc(value)}</div>`).join("")}</div>`:""}
        ${i.date?`<div class="dt2">📅 ${esc(i.date)}</div>`:""}
      </div>
    </div>`).join(""):`<div class="empty">${ITEMS.length?t("noMatch"):t("empty")}</div>`;
  $("foot").textContent=VIEW.length?`${VIEW.length} ${VIEW.length>1?t("items"):t("item")} · ${t("live")}`:"";
}

function openDetail(idx){
  curr=VIEW[idx];
  $("dTitle").textContent=dv(curr,"name");
  $("dPrice").style.display=hasPrice(curr.price)?"":"none";
  $("dPrice").innerHTML=priceHTML(curr.price);
  $("dName").textContent=dv(curr,"name");
  $("dDesc").textContent=dv(curr,"desc")||"";
  const rows=[];
  if(curr.cat)     rows.push([t("lCat"),     esc(dv(curr,"cat")), false]);
  if(srcList(curr.src).length) rows.push([t("lSrc"), esc(srcList(curr.src).join("、")), false]);
  if(curr.date)    rows.push([t("posted"),   esc(curr.date),      false]);
  contactEntries(curr).forEach(([channel,value])=>rows.push([channel,esc(value),true]));
  $("dContact").innerHTML = rows.length
    ? rows.map(([k,v,hi])=>`<div class="drow"><span class="dk">${k}</span><span class="dvv${hi?" hi":""}">${v}</span></div>`).join("")
    : `<div class="drow">${t("ask")}</div>`;
  $("dSwiper").innerHTML=curr.photos.length
    ? curr.photos.map((p,k)=>`<div class="slide"><img src="${p.full}" alt="${esc(curr.name)}" onclick="openLightbox(${k})"></div>`).join("")
    : `<div class="slide"><div class="emoji">${curr.icon}</div></div>`;
  const n=Math.max(curr.photos.length,1);
  $("dDots").innerHTML=n>1?Array.from({length:n},(_,k)=>`<i class="${k?'':'on'}" onclick="slideTo(${k})"></i>`).join(""):"";
  $("sPrev").style.display=$("sNext").style.display=(curr.photos.length>1)?"flex":"none";
  $("dSwiper").scrollLeft=0;
  $("detail").classList.add("open");
  document.body.style.overflow="hidden";
}
function slideBy(d){
  const sw=$("dSwiper");
  const n=Math.max(curr?curr.photos.length:1,1);
  let k=Math.round(sw.scrollLeft/sw.clientWidth)+d;
  k=(k+n)%n;
  sw.scrollTo({left:k*sw.clientWidth,behavior:"smooth"});
}
function slideTo(k){
  const sw=$("dSwiper");
  sw.scrollTo({left:k*sw.clientWidth,behavior:"smooth"});
}
function closeDetail(){
  closeLightbox();
  $("detail").classList.remove("open");
  document.body.style.overflow="";
}

let lbZoom=1,lbX=0,lbY=0,lbDrag=null,lbPinch=null;
const lbPoints=new Map(), clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
function updateLightboxLabels(){
  $("lbHint").textContent=t("zoomHint");
  [["lbClose","closeImage"],["lbMinus","zoomOut"],["lbPlus","zoomIn"],["lbScale","resetZoom"]].forEach(([id,k])=>{$(id).title=$(id).ariaLabel=t(k)});
}
function openLightbox(k){
  if(!curr?.photos[k])return;
  $("lbImage").src=curr.photos[k].full;$("lbImage").alt=dv(curr,"name");
  resetImageZoom();updateLightboxLabels();$("lightbox").classList.add("open");
}
function closeLightbox(){$("lightbox").classList.remove("open");lbPoints.clear();lbDrag=lbPinch=null}
function applyImageTransform(){
  if(lbZoom<=1){lbX=lbY=0}else{
    const i=$("lbImage"),v=$("lbViewport"),mx=Math.max(0,(i.offsetWidth*lbZoom-v.clientWidth)/2),my=Math.max(0,(i.offsetHeight*lbZoom-v.clientHeight)/2);
    lbX=clamp(lbX,-mx,mx);lbY=clamp(lbY,-my,my);
  }
  $("lbImage").style.transform=`translate3d(${lbX}px,${lbY}px,0) scale(${lbZoom})`;
  $("lbScale").textContent=Math.round(lbZoom*100)+"%";$("lbViewport").classList.toggle("zoomed",lbZoom>1);
}
function setImageZoom(z){lbZoom=clamp(z,1,5);applyImageTransform()}
function changeImageZoom(d){setImageZoom(lbZoom+d)}
function resetImageZoom(){lbZoom=1;lbX=lbY=0;applyImageTransform()}
$("lbViewport").addEventListener("wheel",e=>{e.preventDefault();changeImageZoom(e.deltaY<0?.25:-.25)},{passive:false});
$("lbViewport").addEventListener("dblclick",()=>lbZoom>1?resetImageZoom():setImageZoom(2));
$("lbViewport").addEventListener("pointerdown",e=>{
  lbPoints.set(e.pointerId,{x:e.clientX,y:e.clientY});e.currentTarget.setPointerCapture(e.pointerId);
  if(lbPoints.size===1){lbDrag={x:e.clientX,y:e.clientY,px:lbX,py:lbY};$("lbViewport").classList.add("dragging")}
  else{const [a,b]=[...lbPoints.values()];lbPinch={d:Math.hypot(a.x-b.x,a.y-b.y),z:lbZoom};lbDrag=null}
});
$("lbViewport").addEventListener("pointermove",e=>{
  if(!lbPoints.has(e.pointerId))return;lbPoints.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(lbPoints.size===2&&lbPinch){const [a,b]=[...lbPoints.values()];setImageZoom(lbPinch.z*Math.hypot(a.x-b.x,a.y-b.y)/Math.max(lbPinch.d,1))}
  else if(lbDrag&&lbZoom>1){lbX=lbDrag.px+e.clientX-lbDrag.x;lbY=lbDrag.py+e.clientY-lbDrag.y;applyImageTransform()}
});
function endLbPointer(e){
  lbPoints.delete(e.pointerId);if(lbPoints.size<2)lbPinch=null;
  if(lbPoints.size===1){const p=[...lbPoints.values()][0];lbDrag={x:p.x,y:p.y,px:lbX,py:lbY}}
  else if(!lbPoints.size){lbDrag=null;$("lbViewport").classList.remove("dragging")}
}
$("lbViewport").addEventListener("pointerup",endLbPointer);$("lbViewport").addEventListener("pointercancel",endLbPointer);

$("dSwiper").addEventListener("scroll",()=>{
  const sw=$("dSwiper");
  const k=Math.round(sw.scrollLeft/sw.clientWidth);
  [...$("dDots").children].forEach((d,j)=>d.classList.toggle("on",j===k));
});
document.addEventListener("keydown",e=>{
  if($("lightbox").classList.contains("open")){
    if(e.key==="Escape")closeLightbox();
    if(e.key==="+"||e.key==="=")changeImageZoom(.25);
    if(e.key==="-")changeImageZoom(-.25);
    if(e.key==="0")resetImageZoom();
    return;
  }
  if(e.key==="Escape")closeDetail();
  if($("detail").classList.contains("open")&&curr&&curr.photos.length>1){
    if(e.key==="ArrowLeft")slideBy(-1);
    if(e.key==="ArrowRight")slideBy(1);
  }
});

$("q").addEventListener("input",render);
load();
</script>
